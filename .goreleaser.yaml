# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: smart-test-runner

before:
  hooks:
    - go mod tidy

builds:
  - id: smart-test-runner
    main: ./cmd/smart-test-runner
    binary: smart-test-runner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # 386 is intentionally absent: the tool shells out to grove and git, and
    # every platform we support has a 64-bit build.
    ldflags:
      - -s -w -X github.com/NSXBet/go-smart-test-runner/internal/version.Version=v{{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # goreleaser publishes the GitHub release for a pushed tag.
  draft: false
  prerelease: auto

homebrew_casks:
  - name: smart-test-runner
    binaries:
      - smart-test-runner
    homepage: "https://github.com/NSXBet/go-smart-test-runner"
    description: "Select and run only the Go tests a change can affect"
    repository:
      owner: NSXBet
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: nsx-bot
      email: nsx-bot@users.noreply.github.com
    commit_msg_template: "smart-test-runner {{ .Version }}"
    # Pre-releases (v1.2.3-rc1) skip the cask: it would become the "latest"
    # brew install for a build the stable channel should not serve.
    skip_upload: "{{ with .Prerelease }}true{{ end }}"
    # The cask ships linux and darwin binaries (goreleaser emits on_macos and
    # on_linux stanzas). The binary is unsigned, so macOS quarantines it on
    # first run; strip that only on macOS — /usr/bin/xattr does not exist on
    # Linux, so an unguarded postflight breaks the Linux install.
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/smart-test-runner"]
          end
