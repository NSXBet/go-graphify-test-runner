# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: graphify-test-runner

before:
  hooks:
    - go mod tidy

builds:
  - id: graphify-test-runner
    main: .
    binary: graphify-test-runner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # 386 is intentionally absent: the tool shells out to graphify and git, and
    # every platform we support has a 64-bit build.
    ldflags:
      - -s -w -X github.com/NSXBet/go-graphify-test-runner/internal/version.Version=v{{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # goreleaser publishes the GitHub release for a pushed tag.
  draft: false
  prerelease: auto

homebrew_casks:
  - name: graphify-test-runner
    binaries:
      - graphify-test-runner
    homepage: "https://github.com/NSXBet/go-graphify-test-runner"
    description: "Select and run only the Go tests a change can affect"
    repository:
      owner: NSXBet
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    commit_author:
      name: nsx-bot
      email: nsx-bot@users.noreply.github.com
    commit_msg_template: "graphify-test-runner {{ .Version }}"
    # Do not publish a cask for a pre-release (v1.2.3-rc1): it would become the
    # "latest" brew install for a build the stable channel should not serve.
    skip_upload: "{{ with .Prerelease }}true{{ end }}"
    # The binary is unsigned; Homebrew would quarantine it on first run.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/graphify-test-runner"]
          end
