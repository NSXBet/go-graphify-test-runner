# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: graphify-test-runner

before:
  hooks:
    - go mod tidy

builds:
  - id: graphify-test-runner
    main: .
    binary: graphify-test-runner
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # 386 is intentionally absent: the tool shells out to graphify and git, and
    # every platform we support has a 64-bit build.
    ldflags:
      - -s -w -X github.com/NSXBet/go-graphify-test-runner/internal/version.Version=v{{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # goreleaser publishes the GitHub release for a pushed tag.
  draft: false
  prerelease: auto
